# Bulldosser — Deployment Configuration
# Copy this file to config.local.yaml and fill in your values.
# config.local.yaml is gitignored by default.

azure:
  subscription_id: "00000000-0000-0000-0000-000000000000"
  acr_name: "myprojectacr"
  resource_group: "bulldosser-rg"

container:
  image_tag: "latest"
  cpu: 1
  memory_gb: 1.5
  restart_policy: "Always"
  workers_per_vcpu: 250

# 56 verified deployable regions (default Azure account, Oct 2026).
# Default ACI quota: 10 StandardCores per region = 560 max containers at 1 vCPU.
# Set containers to 0 to skip a region. The scale command auto-activates
# dormant regions when scaling beyond current active capacity.
#
# Only westeurope is blocked (not accepting new ACI customers).
#
# Quota increase: request via Azure Portal → Support + Service Limits →
#   Microsoft.ContainerInstance → StandardCores. Typical approvals:
#   - 10 → 50 cores: auto-approved in minutes for most regions
#   - 10 → 100 cores: usually approved within 24h
#   - 10 → 200+ cores: may require business justification, 1-3 business days
#   With 100 cores/region across 56 regions = 5,600 containers max.
regions:
  # North America (10 regions)
  - name: eastus
    containers: 10
  - name: eastus2
    containers: 10
  - name: centralus
    containers: 10
  - name: westus
